{% extends "blogs_app/base.html" %}
{% load django_bootstrap5 %}
{% block page_header %}
    <h2>Login to your account.</h2>
{% endblock page_header %}
{% block content %}
    <form action="{% url 'accounts:login' %}" method='post'>
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="log in" %}
    </form>
{% endblock content %}
