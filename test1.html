<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width,initial-scale=1'>
        <title>hello 我的博客</title>
        {% load django_bootstrap5 %}
        {% bootstrap_css %}
    </head>
    <body>
        <nav class="navbar navbar-expand-md navbar-light bg-light border rounded-2 mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'blogs_app:index' %}">博客主页</a>
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarCollapse"
                        aria-controls="navbarCollapse"
                        aria-expanded='false'
                        aria-label='Toggle navigation'>
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto mb-4 mb-md-0">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'blogs_app:blogs' %}">博客列表</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container">
            {% block content %}
            {% endblock content %}
        </div>
        {% bootstrap_javascript %}
    </body>
</html>
