{% extends "blogs_app/base.html" %}
{% load django_bootstrap5 %}
{% block page_header %}
    <h5>欢迎来到新增博客页面</h5>
{% endblock page_header %}
<!--继承base.html-->
{% block content %}
    <p>玩够了，赶紧写一篇新的博客吧 :</p>
    <!--增加提示语：-->
    <div class="card bg-light mb-2 p-3">
        <form action="{% url 'blogs_app:new_blog' %}" method='post'>
            {% csrf_token %}
            {% bootstrap_form form %}
            <div class="d-flex gap-4">
                <button class="btn btn-outline-primary" name="submit" type="submit">Add a new Blog</button>
                <a class="btn btn-outline-secondary" href="{% url 'blogs_app:blogs' %}">回到博客列表页面</a></div>
        </form>
    </div>
{% endblock content %}
