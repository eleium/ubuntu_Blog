{% extends "blogs_app/base.html" %}
{% load django_bootstrap5 %}
{% block page_header %}
    <h5>欢迎来到新增博文页面</h5>
{% endblock page_header %}
{% block content %}
    <p>在这博客详情页面，可以写一篇新的博文 :</p>
    <!--增加提示语：-->
    <div class="card bg-light p-3 mb-2 rounded-2 border">
        <form action="{% url 'blogs_app:new_post' blog_id=blog.id %}" method='post'>
            {% csrf_token %}
            {% bootstrap_form form %}
            <div class="d-flex gap-4">
                <button class="btn btn-outline-secondary" name='submit' type="submit">Add a new post</button>
                <a class="btn btn-outline-secondary"
                   href="{% url 'blogs_app:blog' blog_id=blog.id %}">回到博客详情</a>
            </div>
        </form>
    </div>
{% endblock content %}
