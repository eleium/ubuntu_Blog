{% extends 'blogs_app/base.html' %}
{% block content %}
<p>
    所有的blog主题都在这啦!这个页面就是博客列表。
</p>
<ul>
    {% for blog in blogs %}
    <li>
        {{ blog.text }}
         <a href ="{% url 'blogs_app:blog' blog.id %}">跳到具体的一个博客去</a>       
    </li>
    {% empty %}
    <li>还没有创建博客主题呢</li>
    {% endfor %}
</ul>
<a href ="{% url 'blogs_app:new_blog' %}">去新增一个博客吧</a>

{% endblock content %}
