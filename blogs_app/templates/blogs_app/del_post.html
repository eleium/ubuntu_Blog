{% extends "blogs_app/base.html" %}
{% block page_header %}
    <h5>确定要删除这篇博文？</h5>
{% endblock page_header %}
{% block content %}
    <div class="card bg-light border rounded-2 mb-3 pb-4 mt-2 p-3">
        <p>谨慎删除博文</p>
        <form action="{% url 'blogs_app:del_post' blog_id=blog.id post_id=post.id %}"
              method='post'>
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button class="btn btn-danger" type='submit'>确认删除</button>
                <a class="btn btn-secondary"
                   href="{% url 'blogs_app:blog' blog_id=blog.id %}">取消删除</a></div>
        </form>
    </div>
{% endblock content %}
